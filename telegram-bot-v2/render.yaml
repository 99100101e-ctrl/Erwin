services:
  - type: web
    name: phantom-edge-v14
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_app_v2:app --bind 0.0.0.0:$PORT
    rootDir: telegram-bot-v2
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: INITIAL_EQUITY
        value: "10000"
