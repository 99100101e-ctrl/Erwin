services:
  - type: web
    name: phantom-edge-v13
    runtime: python
    plan: free
    rootDir: telegram-bot
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
